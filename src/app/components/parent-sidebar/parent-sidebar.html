
<aside class="parent-sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="m2 10 10-6 10 6-10 6-10-6Z"/><path d="M6 12v5c3 3 9 3 12 0v-5M22 10v6"/></svg>
    </div>
    <span>TutorNest</span>
  </div>

  
<div class="profile-menu-wrapper">

  <button
    type="button"
    class="sidebar-profile"
    (click)="toggleProfileMenu()"
    [attr.aria-expanded]="isProfileMenuOpen">

    <div class="profile-avatar">
      {{ firstName.charAt(0).toUpperCase() }}
    </div>

    <div class="profile-info">
      <strong>{{ firstName }}</strong>
      <span>Parent Account</span>
    </div>

    <svg
      class="profile-arrow"
      [class.rotated]="isProfileMenuOpen"
      viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </svg>

  </button>

  @if (isProfileMenuOpen) {
    <div class="profile-dropdown">

      <button
  type="button"
  routerLink="/parent/profile"
  (click)="isProfileMenuOpen = false">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
        <span>My Profile</span>
      </button>

      <button type="button" (click)="isProfileMenuOpen = false">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"/>
        </svg>
        <span>Account Settings</span>
      </button>

    </div>
  }

</div>


  <nav class="sidebar-nav">
    <span class="nav-heading">MAIN MENU</span>

    <a routerLink="/parent/dashboard" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
      <span>Dashboard</span>
    </a>

    <a routerLink="/find-tutor" routerLinkActive="active">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span>Find Tutors</span>
    </a>

    <a routerLink="/parent/request-tutor" routerLinkActive="active">
  <svg viewBox="0 0 24 24">
    <circle cx="10" cy="8" r="4"/>
    <path d="M3 21v-2a7 7 0 0 1 14 0v2M19 8v6M16 11h6"/>
  </svg>
  <span>Request a Tutor</span>
</a>

    <a routerLink="/parent/my-requests" routerLinkActive="active">
  <svg viewBox="0 0 24 24">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </svg>
  <span>My Tuition Requests</span>
</a>
  <a routerLink="/parent/my-demos" routerLinkActive="active">
  <svg viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2"/>
    <path d="M16 3v4M8 3v4M3 10h18M9 15l2 2 4-4"/>
  </svg>
  <span>My Demos</span>
</a>
    <a routerLink="/parent/my-invoices" routerLinkActive="active">
  <svg viewBox="0 0 24 24">
    <path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/>
    <path d="M14 2v6h6M8 13h8M8 17h8"/>
  </svg>
  <span>Invoices</span>
</a>
  </nav>

  <div class="sidebar-bottom">
    <button type="button" (click)="logout()">
      <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
      <span>Logout</span>
    </button>
  </div>

</aside>
